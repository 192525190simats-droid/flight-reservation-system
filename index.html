<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Reservation System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #bbb;
        }

        h1 {
            text-align: center;
            color: #1769aa;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .field {
            flex: 1;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .radio-group label {
            font-weight: normal;
        }

        .radio-group input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f82;
        }

        .cloud {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✈️ Flight Reservation System</h1>

    <p class="subtitle">
        Cloud-Based Flight Booking Application
    </p>

    <form>

        <!-- Trip Type -->
        <label>Trip Type</label>
        <div class="radio-group">
            <label>
                <input type="radio" name="trip" value="One Way" checked>
                One Way
            </label>

            <label>
                <input type="radio" name="trip" value="Round Trip">
                Round Trip
            </label>
        </div>

        <!-- Flight Type -->
        <label>Flight Type</label>
        <div class="radio-group">
            <label>
                <input type="radio" name="flight" value="Domestic" checked>
                Domestic
            </label>

            <label>
                <input type="radio" name="flight" value="International">
                International
            </label>
        </div>

        <!-- From and To -->
        <div class="row">

            <div class="field">
                <label>From</label>
                <select>
                    <option>Chennai</option>
                    <option>Hyderabad</option>
                    <option>Bangalore</option>
                    <option>Delhi</option>
                    <option>Mumbai</option>
                    <option>Kolkata</option>
                </select>
            </div>

            <div class="field">
                <label>To</label>
                <select>
                    <option>Delhi</option>
                    <option>Chennai</option>
                    <option>Hyderabad</option>
                    <option>Bangalore</option>
                    <option>Mumbai</option>
                    <option>Dubai</option>
                    <option>Singapore</option>
                    <option>London</option>
                </select>
            </div>

        </div>

        <!-- Dates -->
        <div class="row">

            <div class="field">
                <label>Departure Date</label>
                <input type="date">
            </div>

            <div class="field">
                <label>Return Date</label>
                <input type="date">
            </div>

        </div>

        <!-- Travelers and Class -->
        <div class="row">

            <div class="field">
                <label>Travelers</label>
                <input type="number" min="1" value="1">
            </div>

            <div class="field">
                <label>Class</label>
                <select>
                    <option>Economy</option>
                    <option>Premium Economy</option>
                    <option>Business</option>
                    <option>First Class</option>
                </select>
            </div>

        </div>

        <!-- Fare Type -->
        <div class="field">
            <label>Fare Type</label>
            <select>
                <option>Regular</option>
                <option>Student</option>
                <option>Senior Citizen</option>
                <option>Flexi</option>
            </select>
        </div>

        <!-- Passenger Name -->
        <div class="field">
            <label>Passenger Name</label>
            <input type="text" placeholder="Enter passenger name">
        </div>

        <!-- Email -->
        <div class="field">
            <label>Email</label>
            <input type="email" placeholder="Enter email address">
        </div>

        <!-- Phone -->
        <div class="field">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number">
        </div>

        <button type="submit">Search / Book Flight</button>

    </form>

    <div class="cloud">
        ☁️ Cloud-Based SaaS Flight Reservation System
    </div>

</div>

</body>
</html>
